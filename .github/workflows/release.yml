name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release (major.minor.patch); blank = next patch. Used only when publish is on"
                type: string
                required: false
            publish:
                description: "Upload and submit for review; otherwise only build the zip"
                type: boolean
                default: false
            publish_type:
                description: "Chrome Web Store publish type"
                type: choice
                options:
                    - DEFAULT_PUBLISH
                    - STAGED_PUBLISH
                default: DEFAULT_PUBLISH

# No permissions by default; each job asks for what it needs.
permissions: {}

# One release at a time; never cancel an upload that is already running.
concurrency:
    group: store-release
    cancel-in-progress: false

# Four jobs on purpose. `release` may write to the repository (the version commit
# and its tag), so it runs no third-party code: only git, Node and npm's own
# `version` command through scripts/set-version.mjs, never `npm ci`. `package` runs
# npm and its third-party code, so it never gets write access, secrets or an OIDC
# token. `publish` and `publish-firefox` get the secrets and run only
# scripts/publish-chrome.sh and scripts/publish-firefox.sh (bash, curl, jq and
# openssl), never npm. They don't depend on each other: one store failing doesn't
# block or undo the other.
#
# Every `uses:` is pinned to a full commit SHA; the comment names the release.
# Raise a pin by looking up the new tag's commit, not by moving to a tag.
jobs:
    # Only a hand run with `publish` on, and only from the default branch. A tag push
    # skips it: the tag already names the version.
    release:
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            version: ${{ steps.version.outputs.version }}
            sha: ${{ steps.commit.outputs.sha }}
        steps:
            # Before anything else: otherwise this job could commit and tag any branch,
            # and `publish` would then be refused by the environment rule.
            - name: Only from the default branch
              env:
                  REF: ${{ github.ref }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
                      echo "::error::releases are made from $DEFAULT_BRANCH; run the workflow there"
                      exit 1
                  fi
            # Credentials stay, since this job pushes. It needs the tags to check the new one is free.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "22.x"
            # Checks the version before writing anything. No `npm ci`: nothing from node_modules runs here.
            - name: Set the version
              id: version
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  version=$(node scripts/set-version.mjs "$VERSION")
                  echo "version=$version" >> "$GITHUB_OUTPUT"
            - name: Commit and tag
              id: commit
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -am "Release v$VERSION"
                  git tag "v$VERSION"
                  git push --atomic origin HEAD "v$VERSION"
                  echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    package:
        needs: release
        # `release` is skipped on a tag push and on a dry run; a failed one stops the run.
        if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            # After a release, build the commit that job made, not the one that was dispatched.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.release.outputs.sha || github.sha }}
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "22.x"
                  cache: npm
            - run: npm ci
            - run: npm run check
            - name: Read the version
              id: version
              env:
                  REF_TYPE: ${{ github.ref_type }}
                  REF_NAME: ${{ github.ref_name }}
                  RELEASE_VERSION: ${{ needs.release.outputs.version }}
              run: |
                  manifest_version=$(node -p 'require("./manifest.json").version')
                  package_version=$(node -p 'require("./package.json").version')
                  if [ "$manifest_version" != "$package_version" ]; then
                      echo "::error::manifest.json is $manifest_version but package.json is $package_version"
                      exit 1
                  fi
                  if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$manifest_version" ]; then
                      echo "::error::tag $REF_NAME does not match version $manifest_version (expected v$manifest_version)"
                      exit 1
                  fi
                  if [ -n "$RELEASE_VERSION" ] && [ "$RELEASE_VERSION" != "$manifest_version" ]; then
                      echo "::error::the release job set $RELEASE_VERSION but the files say $manifest_version"
                      exit 1
                  fi
                  echo "version=$manifest_version" >> "$GITHUB_OUTPUT"
            # The build fails loudly without it. It is a repository variable, not a secret:
            # the backend URL ends up in the public extension anyway.
            - run: npm run package
              env:
                  FRUNCHY_BACKEND_URL: ${{ vars.FRUNCHY_BACKEND_URL }}
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: frunchy-${{ steps.version.outputs.version }}
                  path: release/frunchy-${{ steps.version.outputs.version }}.zip
                  if-no-files-found: error
                  retention-days: 30
            # The Firefox build also ships its source: Mozilla's reviewers rebuild from it.
            - run: npm run package:firefox
              env:
                  FRUNCHY_BACKEND_URL: ${{ vars.FRUNCHY_BACKEND_URL }}
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: frunchy-${{ steps.version.outputs.version }}-firefox
                  path: |
                      release/frunchy-${{ steps.version.outputs.version }}-firefox.zip
                      release/frunchy-${{ steps.version.outputs.version }}-source.zip
                  if-no-files-found: error
                  retention-days: 30

    publish:
        needs: [release, package]
        if: ${{ !cancelled() && needs.package.result == 'success' && (github.event_name == 'push' || needs.release.result == 'success') }}
        runs-on: ubuntu-latest
        # The `production` environment is what restricts when the secrets can be read:
        # it only allows the default branch (hand runs) and `v*` tags, and Bella Baxter's
        # trust domain requires this environment name in the OIDC token.
        environment: production
        permissions:
            contents: read
            id-token: write
        env:
            BELLA_BAXTER_URL: https://api.bella-baxter.io
            BELLA_BAXTER_TENANT: ${{ vars.BELLA_BAXTER_TENANT }}
            BELLA_BAXTER_PROJECT: ${{ vars.BELLA_BAXTER_PROJECT }}
            BELLA_BAXTER_ENV: ${{ vars.BELLA_BAXTER_ENV || 'production' }}
        steps:
            # Only the publish script is needed here, not the sources.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  sparse-checkout: scripts/publish-chrome.sh
                  sparse-checkout-cone-mode: false
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: frunchy-${{ needs.package.outputs.version }}
                  path: release/
            - uses: cosmic-chimps/bella-baxter-setup-action@cf993ff9e477ec89370abb7f166a4e48a2786693 # v0.1.1-preview.137
              with:
                  version: 0.1.1-preview.137
                  oidc: "true"
            # `bella run` injects the Bella secrets into this one process only and does
            # not mask them in the log; publish-chrome.sh masks them itself.
            - name: Upload and submit for review
              run: bella run -- bash scripts/publish-chrome.sh "release/frunchy-$VERSION.zip"
              env:
                  VERSION: ${{ needs.package.outputs.version }}
                  PUBLISH_TYPE: ${{ inputs.publish_type || 'DEFAULT_PUBLISH' }}

    publish-firefox:
        needs: [release, package]
        if: ${{ !cancelled() && needs.package.result == 'success' && (github.event_name == 'push' || needs.release.result == 'success') }}
        runs-on: ubuntu-latest
        # Same environment rule as `publish`.
        environment: production
        permissions:
            contents: read
            id-token: write
        env:
            BELLA_BAXTER_URL: https://api.bella-baxter.io
            BELLA_BAXTER_TENANT: ${{ vars.BELLA_BAXTER_TENANT }}
            BELLA_BAXTER_PROJECT: ${{ vars.BELLA_BAXTER_PROJECT }}
            BELLA_BAXTER_ENV: ${{ vars.BELLA_BAXTER_ENV || 'production' }}
        steps:
            # Only the publish script and the reviewer notes are needed here, not the sources.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  sparse-checkout: |
                      scripts/publish-firefox.sh
                      store/firefox/approval-notes.md
                  sparse-checkout-cone-mode: false
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: frunchy-${{ needs.package.outputs.version }}-firefox
                  path: release/
            - uses: cosmic-chimps/bella-baxter-setup-action@cf993ff9e477ec89370abb7f166a4e48a2786693 # v0.1.1-preview.137
              with:
                  version: 0.1.1-preview.137
                  oidc: "true"
            # `bella run` injects the Bella secrets into this one process only and does
            # not mask them in the log; publish-firefox.sh masks them itself.
            - name: Upload and submit for review
              run: bella run -- bash scripts/publish-firefox.sh "release/frunchy-$VERSION-firefox.zip" "release/frunchy-$VERSION-source.zip"
              env:
                  VERSION: ${{ needs.package.outputs.version }}
